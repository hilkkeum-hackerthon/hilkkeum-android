# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 힐끔 Android 앱 CodeRabbit 설정
# 기준 문서: CLAUDE.md, docs/RULES.md (MVI + Clean Architecture)

language: "ko-KR"
tone_instructions: "한국어로 간결하게 리뷰하세요. 지적 시 위반한 규칙(docs/RULES.md 섹션 번호)과 이유, 수정 예시 코드를 함께 제시하고, 취향 수준의 사소한 스타일 지적은 줄이세요."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "PR 제목은 '[#이슈번호] 작업 내용' 형식이어야 합니다. 예: [#12] 로그인 화면 구현"
    description:
      mode: "warning"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!**/.kotlin/**"
    - "!**/gradle/wrapper/**"
    - "!**/*.webp"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/schemas/**/*.json"

  path_instructions:
    # ───────────────────────── 공통 (모든 Kotlin 파일) ─────────────────────────
    - path: "**/*.kt"
      instructions: |
        [공통 Kotlin 규칙 - RULES.md §1, §5, §15, §18]
        - `!!` 강제 언래핑 사용 시 지적하고 안전한 대안(?.let, ?:, requireNotNull + 메시지)을 제안.
        - `GlobalScope`, 프로덕션 코드의 `runBlocking` 사용 금지.
        - 하드코딩 문자열/매직 넘버는 상수 또는 리소스로 분리.
        - Boolean 프로퍼티/변수는 is/has/can 접두어.
        - 파일명은 대표 public 타입명과 1:1, 파일당 public 타입은 1개 기본.
        - 매퍼/확장 함수는 `*Mapper.kt` / `*Extensions.kt`로 분리.
        - 클래스 내부 배치: private 메서드 상단 → public 메서드 하단 → init 블록 최하단.
        - 조건 분기는 if-else 기본, 조기 반환은 중첩 3단계 이상일 때만 허용.
        - 비밀번호/토큰/개인정보를 Log, println, Timber 등에 남기는지 확인.

        [코루틴 취소/예외 - RULES.md §11 (Android에서 자주 터지는 이슈)]
        - suspend 함수나 코루틴 내부의 `catch (e: Exception)` / `catch (e: Throwable)`이
          `CancellationException`을 삼키는지 반드시 확인. 삼키면 취소가 전파되지 않아
          화면을 떠난 뒤에도 작업이 계속되거나 상태가 오염됨.
          → `catch (e: CancellationException) { throw e }`를 먼저 두거나 `coroutineContext.ensureActive()`로 재전파.
        - suspend 블록에 `runCatching { }` 사용 시 CancellationException까지 Result.failure로 감싸므로 지적.
          → 취소 예외를 재throw하는 전용 헬퍼(예: suspendRunCatching) 사용을 제안.
        - `CancellationException`을 AppError(Unknown/NetworkError 등)로 매핑하거나 에러 UI로 노출하지 않는지 확인.
        - `withTimeout`의 `TimeoutCancellationException`은 CancellationException 하위 타입임을 고려해 처리하는지 확인
          (타임아웃을 실패로 다룰 땐 `withTimeoutOrNull` 권장).
        - `finally`에서 suspend 정리 작업을 할 때 `withContext(NonCancellable)`을 사용하는지 확인.
        - 긴 루프/CPU 작업에서 `ensureActive()` 또는 `yield()`로 협조적 취소를 지원하는지 확인.
        - `launch { }` 안에서 잡히지 않은 예외가 앱 크래시로 이어지지 않는지, `async`의 예외가 `await()` 없이 유실되지 않는지 확인.
        - `Job`을 저장하는 경우 중복 요청 정책(이전 Job cancel 후 재시작 / 진행 중이면 무시)이 명시돼 있는지 확인.
        - `Dispatchers.IO`/`Default`를 클래스 내부에 하드코딩하지 말고 주입받아 테스트 가능하게 할 것.
        - 메인 스레드에서 블로킹 I/O(파일, DB, 네트워크, `Thread.sleep`)를 수행하지 않는지 확인.

    # ───────────────────────── domain 레이어 ─────────────────────────
    - path: "**/domain/**/*.kt"
      instructions: |
        [domain 레이어 - RULES.md §2, §6 / CLAUDE.md 아키텍처]
        - 순수 Kotlin 계층. 다음 import가 있으면 계층 위반으로 지적:
          `android.*`, `androidx.*`(compose, lifecycle, room, navigation 등), `io.ktor.*`, `retrofit2.*`,
          `com.google.firebase.*`, `coil3.*`, 그리고 `..data..` / `..presentation..` 패키지.
        - Context, Activity, Fragment, View, Composable, NavController를 파라미터나 필드로 받지 않는다.
        - UseCase: 이름은 동사+대상+UseCase, `operator fun invoke(...)` 하나만 public으로 가진다(단일 책임).
          UseCase가 다른 UseCase를 직접 호출하지 않고 Repository/Policy 중심으로 구성되는지 확인.
        - Repository는 인터페이스만 이 레이어에 둔다(구현체는 data).
        - 도메인 모델은 불변(`data class` + `val`). `var`, MutableList 노출 금지.
        - 반환 타입은 `AppResult`/`AppError`로 성공·실패를 명확히 표현. 예외를 throw해 상위로 넘기지 않는다.
        - UI 문구, `@StringRes` 리소스 ID 등 표현 계층 정보를 포함하지 않는다.
        - 에러 타입은 Unauthorized, PermissionDenied, ValidationFailed, NetworkError, NotFound, Unknown을 기본으로 한다.

    # ───────────────────────── data 레이어 ─────────────────────────
    - path: "**/data/**/*.kt"
      instructions: |
        [data 레이어 - RULES.md §7, §12 / CLAUDE.md 기술 스택]
        - Repository 구현체는 domain의 Repository 인터페이스를 구현하고, presentation을 참조하지 않는다.
        - DTO(Kotlin Serialization) / Room Entity와 도메인 모델을 분리하고, 변환은 Mapper에서만 수행.
          DTO나 Entity가 Repository 밖(domain/presentation)으로 새어 나가지 않는지 확인.
        - 모든 실패는 `AppError`로 매핑해 반환. 단, CancellationException은 매핑하지 말고 재전파.
        - 비즈니스 정책 판단을 Repository에 넣지 않는다(I/O와 데이터 조합만 담당).

        [Ktor]
        - HttpClient는 매 요청마다 생성하지 말고 DI(@Singleton)로 단일 인스턴스를 재사용.
        - `ResponseException`(ClientRequestException 4xx / ServerResponseException 5xx), `HttpRequestTimeoutException`,
          `IOException`을 AppError(Unauthorized, NotFound, NetworkError 등)로 구분해 매핑하는지 확인.
        - 타임아웃(HttpTimeout) 설정이 있는지, Logging 플러그인이 Authorization 헤더나 토큰을 출력하지 않는지 확인.
        - 서버 응답 원문/예외 메시지를 그대로 상위로 올려 UI에 노출하지 않는다.

        [Kotlin Serialization]
        - DTO에 `@Serializable`, 서버 필드명과 다르면 `@SerialName` 사용.
        - Json 설정의 `ignoreUnknownKeys = true` 여부, nullable/기본값 처리로 역직렬화 크래시가 나지 않는지 확인.
        - release에서 minify(R8)가 켜져 있으므로 리플렉션이 필요한 경우 keep 규칙이 있는지 확인.

        [Room]
        - DAO는 `suspend` 또는 `Flow` 반환으로 메인 스레드 쿼리를 피한다.
        - 스키마 변경 시 Migration을 추가하는지 확인. release에서 `fallbackToDestructiveMigration()`으로 데이터 유실이 없는지.
        - 여러 쓰기 작업은 `@Transaction`으로 묶는다.

    # ───────────────────────── presentation 레이어 (MVI) ─────────────────────────
    - path: "**/presentation/**/*.kt"
      instructions: |
        [MVI 규격 - RULES.md §8 / CLAUDE.md 코드 컨벤션]
        - 화면 단위 파일 구성: `XxxScreen.kt`, `XxxViewModel.kt`, `XxxAction.kt`, `XxxEvent.kt`, `XxxUiState.kt`.
        - ViewModel은 다음 3요소를 기본 규격으로 한다:
          · `uiState: StateFlow<XxxUiState>` (private `MutableStateFlow` + `asStateFlow()`)
          · `event: SharedFlow<XxxEvent>` (private `MutableSharedFlow(replay = 0)` + `asSharedFlow()`)
          · `fun onAction(action: XxxAction)` — UI가 호출하는 유일한 public 진입점
        - Mutable 타입(`MutableStateFlow`, `MutableSharedFlow`)을 public으로 노출하면 지적.
        - `onAction` 내부에서만 쓰이는 핸들러가 public이면 private으로 바꾸라고 지적.
        - UiState는 불변 타입이어야 하며 로딩/성공/빈 상태/실패를 필요한 범위에서 표현해야 한다.
          상태 변경은 `_uiState.update { it.copy(...) }`처럼 원자적으로 수행.
          `_uiState.value = _uiState.value.copy(...)`는 동시 업데이트 시 경쟁 상태가 생기므로 지적.
        - 단발성 효과(토스트, 네비게이션, 외부 화면 실행, 로그인 유도)는 UiState가 아닌 `event`로 보낸다.
          event를 상태처럼 저장해 재소비 가능하게 만들면 지적.
        - event 유실 주의: `tryEmit`은 버퍼가 없으면(extraBufferCapacity = 0) 수집자가 없을 때 조용히 실패한다.
          유실을 허용할 수 없는 이벤트라면 버퍼/소비 정책(extraBufferCapacity, Channel 등)이 명시돼 있는지 확인.
        - Action/Event는 sealed interface(또는 sealed class)로 정의하고 `when`이 exhaustive인지 확인.

        [ViewModel]
        - `@HiltViewModel` + `@Inject constructor`, 의존성은 UseCase만 받는다.
          Repository, DataSource, HttpClient, DAO를 ViewModel/Composable에서 직접 참조하면 계층 위반.
        - 비동기 작업은 `viewModelScope`에서만 실행.
        - Context, Activity, View, Composable 람다, NavController를 ViewModel 필드에 보관하면 메모리 누수로 지적.
        - 비즈니스 정책/권한 판단은 UseCase·Policy로 위임하고 ViewModel/화면에 하드코딩하지 않는다.

        [Compose - RULES.md §9, §13]
        - `XxxScreen`: ViewModel 연결, `collectAsStateWithLifecycle()`로 상태 수집, event 수집, Navigation 연결 담당.
        - `XxxContent`: ViewModel을 참조하지 않고 `uiState` + `onAction` 콜백만 받는다. Preview는 Content 기준.
        - 상태 수집에 `collectAsState()`를 쓰면 `collectAsStateWithLifecycle()`로 바꾸라고 지적.
        - event 수집은 `LaunchedEffect` 안에서 생명주기를 고려(`repeatOnLifecycle`/`flowWithLifecycle` 등)해 수행.
        - `LaunchedEffect`/`DisposableEffect`의 key가 적절한지(`Unit` 남용, 매 재구성마다 바뀌는 key) 확인하고,
          DisposableEffect는 `onDispose` 정리를 포함해야 한다.
        - Composable 본문에서 네트워크/DB I/O나 `viewModel.onAction` 같은 사이드 이펙트를 직접 실행하면 지적.
        - `remember`의 key 누락, 회전 시 유지해야 할 입력값에 `rememberSaveable` 미사용 여부 확인.
        - `LazyColumn`/`LazyRow`의 `items`에 안정적인 `key` 지정 여부 확인.
        - 불필요한 재구성: 파생 값은 `derivedStateOf`, 파라미터는 안정 타입(불변 컬렉션 등) 사용을 검토.
        - Composable 함수명은 파스칼케이스이고 파일명과 일치. 재사용 가능한 Composable은 `modifier: Modifier = Modifier`를 첫 번째 선택 파라미터로 받는다.
        - Dialog/ModalBottomSheet 등 화면 바깥 계층 UI의 표시 여부는 상위 Screen이 소유.
        - 문자열은 `stringResource()`, 색상/타이포/간격은 디자인 시스템 토큰 사용. hex 색상(`Color(0xFF...)`) 하드코딩 금지.
        - 이미지(Coil3 `AsyncImage`)와 아이콘에 `contentDescription`을 지정(장식용이면 null 명시)하고 클릭 영역(48dp)을 확인.

        [Navigation - RULES.md §3, §10]
        - 라우트는 타입 안전한 Route 정의(@Serializable 등)를 사용하고 문자열 조합 금지.
        - 화면 이동은 Composable 내부 로직이 아닌 event → 상위 NavHost에서 처리.
        - 인증 필요 화면/액션은 공통 인증 가드와 pendingRoute/pendingAction 정책을 거치는지 확인.

    # ───────────────────────── theme / 디자인 시스템 ─────────────────────────
    - path: "**/ui/theme/**/*.kt"
      instructions: |
        [디자인 시스템 - RULES.md §13-1]
        - 이 경로는 색상/타이포 토큰 정의 위치이므로 hex 색상 정의를 허용한다.
        - 라이트/다크 테마 값이 단일 시맨틱 토큰 기준으로 관리되는지 확인.

    # ───────────────────────── DI (Hilt) ─────────────────────────
    - path: "**/di/**/*.kt"
      instructions: |
        [Hilt DI - RULES.md §4]
        - 모듈은 기능/계층별로 분리하고 이름에서 제공 책임이 드러나야 한다(예: NetworkModule, RepositoryModule).
        - 인터페이스 바인딩은 `@Binds`(abstract), 외부 라이브러리 객체 생성은 `@Provides`를 사용.
        - `@InstallIn` 컴포넌트와 스코프(@Singleton 등)가 객체 수명과 맞는지 확인.
          HttpClient, Room Database, ImageLoader는 @Singleton.
        - Context가 필요하면 `@ApplicationContext`만 주입하고 Activity Context를 싱글톤에 넣지 않는다.
        - Dispatcher는 Qualifier(@IoDispatcher 등)로 주입해 테스트에서 교체 가능하게 한다.

    # ───────────────────────── 테스트 ─────────────────────────
    - path: "**/src/test/**/*.kt"
      instructions: |
        [테스트 - RULES.md §14]
        - UseCase 단위 테스트 우선. Repository는 Fake/Mock DataSource로 성공/실패/빈 데이터/경계 조건 검증.
        - ViewModel 테스트는 `uiState` 변화와 `event` 발생을 모두 검증.
        - 코루틴 테스트는 `runTest` + `StandardTestDispatcher`/`UnconfinedTestDispatcher`, Main 디스패처 교체를 사용.
          `Thread.sleep`, 실제 delay 대기에 의존하지 않는다. Flow 검증은 Turbine 등 공식/표준 도구 사용을 권장.
        - 실제 네트워크나 운영 계정에 의존하지 않는다.
        - 취소 시나리오(CancellationException 전파)가 중요한 로직이면 해당 케이스 테스트를 권장.

    - path: "**/src/androidTest/**/*.kt"
      instructions: |
        - 핵심 사용자 흐름은 Compose UI 테스트로 검증하고, 실제 네트워크/운영 데이터에 의존하지 않는다.
        - 텍스트 대신 testTag/semantics 기반으로 노드를 찾는 것을 권장.

    # ───────────────────────── Android 리소스/설정 ─────────────────────────
    - path: "**/AndroidManifest.xml"
      instructions: |
        [RULES.md §19]
        - 실제 사용하는 기능에 필요한 최소 권한만 선언했는지 확인.
        - intent-filter가 있는 컴포넌트는 `android:exported`를 명시하고, 불필요한 exported="true"가 없는지 확인.
        - `usesCleartextTraffic="true"` 등 보안 약화 설정이 없는지 확인.
        - 딥링크로 들어오는 외부 입력은 신뢰하지 않고 검증 후 처리해야 함을 상기.

    - path: "**/res/values*/**/*.xml"
      instructions: |
        - 문자열 리소스 이름은 화면/기능 prefix로 일관되게 짓는다.
        - 색상 리소스는 디자인 시스템 토큰과 중복되지 않는지 확인.

    - path: "**/*.gradle.kts"
      instructions: |
        - 의존성/플러그인 버전은 `gradle/libs.versions.toml`(Version Catalog)로 관리하고 빌드 스크립트에 하드코딩하지 않는다.
        - API 키·비밀 값을 빌드 스크립트에 직접 쓰지 않는다(local.properties 또는 CI 시크릿 사용).
        - release `isMinifyEnabled = true` 상태이므로 새 라이브러리 추가 시 R8 keep 규칙 필요 여부 확인.

    - path: "gradle/libs.versions.toml"
      instructions: |
        - 별칭 네이밍이 기존 규칙(kebab-case, group 기반)과 일치하는지 확인.
        - 사용하지 않는 버전/라이브러리 항목이 추가되지 않았는지 확인.

  tools:
    detekt:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
